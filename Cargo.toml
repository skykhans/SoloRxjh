[package]
name = "solo-rxjh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "SoloRxjh — a Rust 3D cultivation RPG prototype"
publish = false
default-run = "solo-rxjh"

[features]
verification = []

[[bin]]
name = "verify-native"
path = "src/bin/verify_native.rs"
required-features = ["verification"]

[dependencies]
bevy = { version = "=0.17.3", default-features = false, features = [
    "std", "async_executor", "bevy_log", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_light",
    "bevy_pbr", "bevy_render", "bevy_state", "bevy_text", "bevy_ui",
    "bevy_ui_render", "bevy_ui_picking_backend", "bevy_window", "bevy_winit", "default_font",
    "multi_threaded", "png", "bevy_gizmos", "bevy_gltf", "animation", "bevy_scene", "bevy_audio", "wav",
] }
ron = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
